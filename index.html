<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        var match = document.cookie.match(/(?:^|;\s*)theme=([^;]+)/);
        if (match && match[1] === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Kelolastok - Aplikasi Manajemen Stok Modern bertenaga React 19, Vite, dan shadcn UI." />
    <title>Kelolastok | Vite + React 19 + shadcn UI</title>
  </head>
  <body class="min-h-screen bg-background text-foreground antialiased selection:bg-primary selection:text-primary-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
